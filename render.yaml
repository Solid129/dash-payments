databases:
  - name: andpayments-db
    databaseName: andpayments
    user: andpayments
    plan: starter

services:
  - type: web
    name: andpayments-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate -w @andpayments/api && npm run db:seed -w @andpayments/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: andpayments-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://andpayments-web.onrender.com
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: PSP_WEBHOOK_SECRET
        sync: false
      - key: PSP_CALLBACK_URL
        value: https://andpayments-api.onrender.com/api/webhooks/payouts
      - key: PSP_PROCESSING_DELAY_MS
        value: 2500
      - key: PSP_SETTLEMENT_DELAY_MS
        value: 8000

  - type: web
    name: andpayments-web
    runtime: static
    buildCommand: npm ci && npm run build -w @andpayments/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://andpayments-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
