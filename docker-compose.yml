services:
  nginx:
    image: nginx:1.27-alpine
    container_name: andpayments-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - andpayments-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: andpayments-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: andpayments
      POSTGRES_PASSWORD: andpayments
      POSTGRES_DB: andpayments
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U andpayments -d andpayments']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - andpayments-network

  adminer:
    image: adminer:4
    container_name: andpayments-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - andpayments-network

  # migrate:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.api
  #     target: builder
  #   container_name: andpayments-migrate
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file: .env
  #   environment:
  #     DATABASE_URL: postgresql://andpayments:andpayments@postgres:5432/andpayments
  #   command: sh -c "npm run db:migrate -w @andpayments/api && npm run db:seed -w @andpayments/api"
  #   networks:
  #     - andpayments-network
  #   restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: andpayments-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # migrate:
      #   condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://andpayments:andpayments@postgres:5432/andpayments
    networks:
      - andpayments-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    container_name: andpayments-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - andpayments-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3001']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:

networks:
  andpayments-network:
    driver: bridge
